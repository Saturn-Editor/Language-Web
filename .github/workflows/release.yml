name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: |
          version=$(jq -r .version saturn-language.json)
          id=$(jq -r .id saturn-language.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "zip=$id-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" > /dev/null 2>&1; then
            echo "Release ${{ steps.meta.outputs.tag }} already exists; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.check.outputs.exists == 'false'
        id: zip
        run: |
          # Tracked files only, with saturn-language.json at the zip root.
          git archive --format=zip -o "${{ steps.meta.outputs.zip }}" HEAD -- . ':!.github' ':!.gitignore' ':!.idea'
          echo "sha256=$(sha256sum "${{ steps.meta.outputs.zip }}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.zip }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.meta.outputs.tag }}" \
            --notes "SHA-256 of \`${{ steps.meta.outputs.zip }}\`: \`${{ steps.zip.outputs.sha256 }}\`"
